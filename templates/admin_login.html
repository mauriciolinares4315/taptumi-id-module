{% extends "base.html" %}
{% block title %}Admin · {{ site_name }}{% endblock %}
{% block content %}
<div class="glass-card" style="margin-top: 12vh;">
  <p class="eyebrow">Panel de administración</p>
  <h1>Iniciar sesión</h1>
  <form method="POST" style="margin-top:14px;">
    <label for="username">Usuario</label>
    <input id="username" type="text" name="username" required autofocus>
    <label for="password">Contraseña</label>
    <div class="password-wrapper">
      <input id="password" type="password" name="password" required>
      <button type="button" class="password-toggle" aria-label="Mostrar contraseña" onclick="togglePasswordVisibility(this)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button class="btn btn-action" type="submit" style="margin-top:20px;">Entrar</button>
  </form>
</div>
{% endblock %}
